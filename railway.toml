# Domínio próprio: Settings → Networking → Custom Domain
# ou `railway domain seudominio.com` (mostra CNAME + TXT).
# Depois no Railway Variables:
#   PUBLIC_BASE_URL=https://seudominio.com
# Discord OAuth2 Redirect:
#   https://seudominio.com/api/auth/discord/callback

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "node dist/index.js"
restartPolicyType = "ON_FAILURE"
