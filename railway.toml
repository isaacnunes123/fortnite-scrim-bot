# Serviço do BOT Discord (gateway 24/7). Não serve o site público.
# Site: Vercel → buildscrims.online
# Crie um serviço Railway chamado "bot" (não o domínio do site) e use este start.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "node dist/bot.js"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
